{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:title" content="Family Guard" />
    <meta property="og:description" content="Family Guard parental safety dashboard" />
    <meta property="og:image" content="/static/icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/pages/recordings/" />
    <title>Recordings — Device Monitor</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <link rel="icon" href="{% static 'icons/icon-192.png' %}" type="image/png" />
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="{% static 'js/app.js' %}"></script>
  </head>
  <body>
    <section class="notice">
      <span>Family Guard device pairing is ready. Bind an authorized device to begin.</span>
      <button class="bind-btn" data-action="bind">Bind Device</button>
    </section>
    <main class="page-content">
      <div class="stats">
        <div class="stat">
          <i class="bi bi-mic text-danger"></i><small>Total Recordings</small><strong>17</strong>
        </div>
        <div class="stat">
          <i class="bi bi-clock text-primary"></i><small>Total Duration</small><strong>01:42:36</strong>
        </div>
        <div class="stat">
          <i class="bi bi-hdd text-success"></i><small>Storage Used</small><strong>12.4 MB</strong>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">Call Recordings</span>
        </div>
        <div class="search-filter">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input id="recSearch" data-search="true" data-target="#recRows .rec-row" placeholder="Search caller..." />
          </div>
          <select class="filter-select">
            <option>All Recordings</option>
            <option>Incoming</option>
            <option>Outgoing</option>
          </select>
        </div>
        <div id="recRows">
          <div class="p-3 border-bottom d-flex align-items-center gap-3 rec-row" data-name="Jane">
            <div class="avatar" style="background: #ee5d67"><i class="bi bi-mic"></i></div>
            <div class="flex-grow-1">
              <b>Jane</b>
              <div class="small text-muted">Incoming • Today 14:22 • 04:32</div>
            </div>
            <button class="btn btn-sm btn-light">
              <i class="bi bi-play-fill"></i></button><button class="btn btn-sm btn-light">
              <i class="bi bi-download"></i>
            </button>
          </div>
          <div class="p-3 border-bottom d-flex align-items-center gap-3 rec-row" data-name="David">
            <div class="avatar" style="background: #43aeea"><i class="bi bi-mic"></i></div>
            <div class="flex-grow-1">
              <b>David</b>
              <div class="small text-muted">Outgoing • Today 11:41 • 02:18</div>
            </div>
            <button class="btn btn-sm btn-light">
              <i class="bi bi-play-fill"></i></button>
              <button class="btn btn-sm btn-light"><i class="bi bi-download"></i></button>
          </div>
        </div>
      </div>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        recSearch.oninput = () =>
          document
            .querySelectorAll(".rec-row")
            .forEach(
              (r) =>
                (r.style.display = r.dataset.name
                  .toLowerCase()
                  .includes(recSearch.value.toLowerCase())
                  ? "flex"
                  : "none"),
            );
      });
    </script>
  </body>
</html>
