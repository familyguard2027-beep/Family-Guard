services:
  - type: web
    name: family-guard-monitor
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn family_guard.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: family_guard.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,family-guard-monitor.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: Admin111
      - key: ADMIN_EMAIL
        value: admin111@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin1234
      - key: DATABASE_URL
        fromDatabase:
          name: family-guard-db
          property: connectionString

databases:
  - name: family-guard-db
    databaseName: family_guard_db
    user: family_guard
    plan: free
